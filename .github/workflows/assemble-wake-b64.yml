name: Assemble wake b64
on:
  push:
    paths:
      - 'parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts
        run: |
          set -euo pipefail
          NEED_M=64
          NEED_A=148
          M=$(ls parts/morning.mp3.b64.part* 2>/dev/null | wc -l)
          A=$(ls parts/ambient.mp3.b64.part* 2>/dev/null | wc -l)
          echo "morning parts=$M ambient parts=$A"
          if [ "$M" -ge "$NEED_M" ]; then
            cat $(ls parts/morning.mp3.b64.part* | sort) > morning.mp3.b64
            wc -c morning.mp3.b64
          fi
          if [ "$A" -ge "$NEED_A" ]; then
            cat $(ls parts/ambient.mp3.b64.part* | sort) > ambient.mp3.b64
            wc -c ambient.mp3.b64
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning.mp3.b64 ambient.mp3.b64 || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "assemble wake audio b64 from parts"
            git push
          fi
