name: Assemble wake b64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts
        run: |
          set -euo pipefail
          NEED_M=64
          NEED_A=148
          shopt -s nullglob
          M_PARTS=(parts/morning.mp3.b64.part*)
          A_PARTS=(parts/ambient.mp3.b64.part*)
          M=${#M_PARTS[@]}
          A=${#A_PARTS[@]}
          echo "morning parts=$M ambient parts=$A"
          if [ "$M" -lt "$NEED_M" ] || [ "$A" -lt "$NEED_A" ]; then
            echo "Not enough parts yet (need morning>=$NEED_M ambient>=$NEED_A). Exiting OK."
            exit 0
          fi
          IFS=$'\n'
          cat $(printf '%s\n' "${M_PARTS[@]}" | sort) > morning.mp3.b64
          cat $(printf '%s\n' "${A_PARTS[@]}" | sort) > ambient.mp3.b64
          wc -c morning.mp3.b64 ambient.mp3.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning.mp3.b64 ambient.mp3.b64
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "assemble wake audio b64 from parts"
            git push
          fi
